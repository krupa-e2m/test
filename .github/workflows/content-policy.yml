name: Content policy

# Fails when the restricted term (defined in .github/content-policy/scan.py)
# appears in code, file names, PR text, PR comments/reviews, commit messages,
# branch names or releases, and posts every location to Slack.
#
# Commit this same file to dev-connect-wp, dev-command AND the default branch:
# GitHub reads PR workflows from the PR's base branch, but comment events and
# the nightly schedule only from the default branch.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  release:
    types: [published, edited]
  push:
    branches: [dev-connect-wp, dev-command]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to scan
        required: true
        default: dev-connect-wp

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  pull-request:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: content-policy-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      # The scanner always comes from the base (or default) branch, never from
      # the PR, so a PR can't switch the check off by editing it.
      - name: Check out scanner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      # PR code is only read by the scanner, never executed.
      - name: Check out PR
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Scan PR
        run: python3 policy/.github/content-policy/scan.py pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
          TARGET_DIR: target

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out scanner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Scan release
        run: python3 policy/.github/content-policy/scan.py release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}

  branch:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Nightly: both product branches. Push/manual: just that ref.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["dev-connect-wp","dev-command"]' || format('["{0}"]', github.event_name == 'push' && github.ref_name || inputs.ref)) }}
    steps:
      - name: Check out scanner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          path: target
          persist-credentials: false

      - name: Scan branch
        run: python3 policy/.github/content-policy/scan.py branch
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
          TARGET_DIR: target
          TARGET_REF: ${{ matrix.ref }}

  recent-releases:
    # Catches assets uploaded after the release event fired, and anything
    # published before this workflow existed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scanner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: policy
          persist-credentials: false

      - name: Scan recent releases
        run: python3 policy/.github/content-policy/scan.py recent-releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
          RECENT_RELEASES: "10"
